    <!-- Mobile/Tablet-only Menu Styles (fixed, constant) -->
    <style>
      :root{
        --nav-h:56px;
        --nav-bg:#1e202f;           /* requested color */
        --nav-border:#141627;
        --nav-link:#ffffff;
        --nav-link-hover:#ffcb05;
        --max-w:1100px;
      }

      /* Hidden on desktop; shown and fixed on tablet/mobile */
      .custom-navbar{display:none;}

      @media (max-width:1024px){
        html { scroll-behavior:smooth; }
        body{ margin:0; padding-top: var(--nav-h); } /* offset content for fixed header */

        .custom-navbar{
          display:block;
          position:fixed;           /* fixed: constant, won’t move on scroll */
          top:0; left:0; right:0;
          z-index:9999;
          background:var(--nav-bg);
          color:var(--nav-link);
          border-bottom:1px solid var(--nav-border);
          font-family:Avenir, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        .custom-nav-wrap{
          max-width:var(--max-w);
          margin:0 auto;
          height:var(--nav-h);
          display:flex;
          align-items:center;
          justify-content:space-between;
          padding:0 16px;
        }

        .custom-logo{ font-weight:700; letter-spacing:.3px; font-size:16px; }

        .custom-menu-btn{
          background:none; border:none; color:var(--nav-link);
          font-size:24px; line-height:1; cursor:pointer;
        }

        /* Drop-down panel fixed under the header */
        .custom-links{
          position:fixed;
          left:0; right:0; top:var(--nav-h);
          background:var(--nav-bg);
          border-bottom:1px solid var(--nav-border);
          display:none; flex-direction:column;
          z-index:10000;
        }
        .custom-links[data-open="true"]{ display:flex; }

        .custom-links a{
          color:var(--nav-link);
          text-decoration:none;
          padding:14px 16px;
          border-top:1px solid #2a2c3d;
          opacity:.95;
        }
        .custom-links a:hover{ color:var(--nav-link-hover); opacity:1; }

        /* Keep a little breathing room below panel when open (content is already padded by body) */
        #root{ display:block; }
      }

      /* === NEW: GPT launcher styles (works on desktop & mobile) === */
      .gpt-floating{
        position:fixed; right:16px; bottom:16px; z-index:100000; /* above navbar & menu panel */
        display:flex; flex-direction:column; gap:10px;
      }
      .gpt-btn{
        background:#1e202f; color:#fff; border:0; border-radius:999px;
        padding:.75rem 1rem; font-family:Avenir, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-weight:700; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.25);
        transition:opacity .15s ease-in-out, transform .1s ease-in-out;
      }
      .gpt-btn:hover{ opacity:.9 }
      .gpt-btn:active{ transform:scale(.98) }

      .gpt-backdrop{
        position:fixed; inset:0; background:rgba(0,0,0,.5);
        display:none; align-items:center; justify-content:center; z-index:100001; /* above everything */
      }
      .gpt-backdrop[aria-hidden="false"]{ display:flex; }
      .gpt-modal{
        width:min(92vw, 420px); background:#1e202f; color:#fff;
        border-radius:14px; border:1px solid rgba(255,255,255,.12);
        box-shadow:0 20px 50px rgba(0,0,0,.5); overflow:hidden; position:relative;
      }
      .gpt-header{
        display:flex; align-items:center; justify-content:space-between;
        padding:.75rem 1rem; border-bottom:1px solid rgba(255,255,255,.12);
      }
      .gpt-close{
        background:transparent; color:#fff; border:0; font-size:20px; cursor:pointer; line-height:1;
      }
      .gpt-body{ padding:1rem; }
      .gpt-body a{ color:#ffcb05; text-decoration:underline; }

      /* lift button a bit on small screens (avoid thumbs & any mobile UI) */
      @media (max-width:1024px){
        .gpt-floating{ bottom:84px; } /* if your mobile header ever sits bottom, adjust here */
      }
    </style>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Mobile/Tablet-only Header (outside React) -->
    <header class="custom-navbar" role="banner" aria-label="Site">
      <div class="custom-nav-wrap">
        <div class="custom-logo">Nithin Sai Adupa</div>
        <button class="custom-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="custom-nav">☰</button>

        <!-- Collapsible Links (wired to your sections, plus Resume) -->

        </nav>
      </div>
    </header>

    <div id="root"></div>

    <!-- === NEW: Floating Chat button + "native" modal while popup opens === -->
    <div class="gpt-floating" aria-live="polite">
      <button id="openMyGPT" class="gpt-btn">💬 Chat with my GPT</button>
    </div>

    <div id="gptBackdrop" class="gpt-backdrop" aria-hidden="true">
      <div class="gpt-modal" role="dialog" aria-modal="true" aria-label="Chat with Nithin’s GPT">
        <div class="gpt-header">
          <strong>Nithin’s Personal GPT</strong>
          <button id="gptClose" class="gpt-close" aria-label="Close">×</button>
        </div>
        <div class="gpt-body">
          <p>Opening a secure chat window…</p>
          <p>If it didn’t open, <a id="gptDirect" href="#" target="_blank" rel="noopener">click here</a>.</p>
        </div>
      </div>
    </div>

    <!-- Toggle + offset-aware smooth scrolling + Resume fallback -->
    <script>
      (function(){
        var btn = document.querySelector('.custom-menu-btn');
        var nav = document.getElementById('custom-nav');
        if(!btn || !nav) return;

        function toggle(){
          var open = nav.getAttribute('data-open') === 'true';
          nav.setAttribute('data-open', String(!open));
          btn.setAttribute('aria-expanded', String(!open));
        }
        function closeMenu(){
          nav.setAttribute('data-open','false');
          btn.setAttribute('aria-expanded','false');
        }

        // Open/close
        btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
        document.addEventListener('click', function(e){
          if(!nav.contains(e.target) && !btn.contains(e.target)) closeMenu();
        });

        // Smooth scroll with fixed-header offset
        function scrollWithOffset(targetId){
          var el = document.getElementById(targetId);
          if(!el) return false;
          var header = document.querySelector('.custom-navbar');
          var h = header ? header.getBoundingClientRect().height : 0;
          var top = window.pageYOffset + el.getBoundingClientRect().top - h - 8;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
          return true;
        }

        // Link handling (including Resume fallback)
        nav.addEventListener('click', function(e){
          var a = e.target.closest('a'); if(!a) return;
          var isResume = a.hasAttribute('data-resume');
          var href = a.getAttribute('href') || '';

          // Resume logic
          if(isResume){
            e.preventDefault();
            closeMenu();
            // Try to scroll to #Resume if that section exists; otherwise open PDF
            var handled = scrollWithOffset('Resume');
            if(!handled){
              window.open('/Nithin_Sai_Adupa.pdf', '_blank', 'noopener,noreferrer');
            }
            return;
          }

          // Normal in-page targets
          if(href.startsWith('#')){
            e.preventDefault();
            closeMenu();
            scrollWithOffset(href.slice(1));
          }
        });

        // Respect deep links on first load
        if(location.hash){
          window.addEventListener('load', function(){
            setTimeout(function(){ scrollWithOffset(location.hash.slice(1)); }, 60);
          });
        }
      })();
    </script>

    <!-- === NEW: Native-looking GPT popup controller === -->
    <script>
      (function(){
        var GPT_URL = "https://chatgpt.com/g/g-68e6c55c6d608191befa03d3b951c7a3-nithins-personal-gpt?model=gpt-4o";
        var openBtn = document.getElementById("openMyGPT");
        var back    = document.getElementById("gptBackdrop");
        var close   = document.getElementById("gptClose");
        var direct  = document.getElementById("gptDirect");

        function openPopup(url){
          var w = 420, h = 680;
          var y = Math.max(0, (window.outerHeight - h) / 2 + (window.screenY || 0));
          var x = Math.max(0, (window.outerWidth  - w) / 2 + (window.screenX || 0));
          var features = "popup=yes,toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes,width="+w+",height="+h+",left="+x+",top="+y;
          // Returns window handle or null if blocked
          return window.open(url, "_blank", features);
        }

        function showModal(){
          back.setAttribute("aria-hidden","false");
          document.body.style.overflow = "hidden"; // prevent background scroll
        }
        function hideModal(){
          back.setAttribute("aria-hidden","true");
          document.body.style.overflow = "";
          openBtn && openBtn.focus();
        }

        openBtn.addEventListener("click", function(){
          showModal();
          direct.href = GPT_URL; // fallback link in modal
          var win = openPopup(GPT_URL);
          if(!win){ // popup blocked → fallback new tab
            window.open(GPT_URL, "_blank", "noopener,noreferrer");
          }
        });

        close && close.addEventListener("click", hideModal);
        back && back.addEventListener("click", function(e){
          if(e.target === back) hideModal();
        });
        document.addEventListener("keydown", function(e){
          if(e.key === "Escape" && back.getAttribute("aria-hidden")==="false") hideModal();
        });
      })();
    </script>
  </body>
